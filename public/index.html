<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B3141F">
<meta name="description" content="Find wineries, read their stories, browse their wines and never miss a tasting.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Winear.me">
<title>Winear.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="leaflet.css">
<style>
/* VOICE: warm, unhurried, a sommelier's map rather than a dashboard
   IDEA: an old cellar map — the world as parchment-free stone, bottles standing where the wine is made
   PICTURE: the full-screen map itself, bottles coloured by the wine each estate is known for
   COLOUR and TYPE: deep bordeaux (dominant chrome), stone land, sea in dusk blue-grey; Cormorant Garamond titles + DM Sans
   LAYOUT: map edge to edge; floating top bar; a right-hand cellar card (bottom sheet on phones) */
:root{color-scheme:light dark;
--bg:light-dark(#fbf8f6,#17121a);--ink:light-dark(#22171d,#f2eaee);--mute:light-dark(#6d5d65,#b5a6ad);
--wine:light-dark(#6d1a36,#c9496f);--wine-d:#4a0f24;--gold:#d7ae4e;--line:light-dark(#e6dde1,#362a31);
--card:light-dark(#ffffff,#211a21);--sea:light-dark(#cfd8dc,#0f1418);--land:light-dark(#f4efe9,#2a2429);--border:light-dark(#d6cbc3,#463c43);
--soft:light-dark(#f5edf0,#2c2128)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#map{position:fixed;inset:0;background:var(--sea)}
.leaflet-container{font:inherit;background:#aad3df}
.leaflet-tooltip{font:500 13px "DM Sans",sans-serif;border-radius:8px;border:0;box-shadow:0 4px 14px #0003;background:var(--card);color:var(--ink)}
.leaflet-tooltip-top:before{border-top-color:var(--card)}
.leaflet-control-zoom a{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important;width:40px!important;height:40px!important;line-height:40px!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--card) 80%,transparent)!important;color:var(--mute)!important;font-size:11px}
.bottle{filter:drop-shadow(0 3px 3px #0005);transition:transform .15s}
.bottle:hover{transform:translateY(-3px) scale(1.08)}
.cluster{display:grid;place-items:center;border-radius:50%;background:var(--wine);color:#fff;font-weight:700;font-size:14px;border:3px solid #fff;box-shadow:0 4px 12px #0004}
.picking #map{cursor:crosshair}

/* top bar */
.bar{position:fixed;top:12px;left:12px;right:12px;z-index:1000;display:flex;gap:8px;align-items:center;pointer-events:none}
.bar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:6px;background:#B3141F;color:#fff;padding:6px 14px 6px 10px;border-radius:999px;box-shadow:0 6px 18px #0003;height:46px}
.brand b{font:600 22px Fraunces,Georgia,serif;letter-spacing:-.3px;color:#F7F1E6}
.brand b span{color:#E0BC62}
.search{position:relative;flex:1;max-width:380px}
.search input{width:100%;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 16px 0 42px;font-size:16px;box-shadow:0 6px 18px #0002}
.search svg{position:absolute;left:14px;top:13px;opacity:.55}
.results{position:absolute;top:52px;left:0;right:0;background:var(--card);border-radius:14px;box-shadow:0 10px 30px #0003;overflow:hidden;display:none}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 16px;min-height:44px}
.results button:hover,.results button:focus{background:var(--soft)}
.results small{color:var(--mute);display:block}
.sp{flex:1}
.pill{height:46px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 16px;font-weight:500;box-shadow:0 6px 18px #0002;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill:hover{border-color:var(--wine)}
.me{padding:0 6px 0 6px}
.me img{width:34px;height:34px;border-radius:50%}
.badge{background:var(--gold);color:#2a1a00;border-radius:999px;font-size:12px;font-weight:700;padding:1px 7px}
.menu{position:fixed;top:66px;right:12px;z-index:1001;background:var(--card);border-radius:14px;box-shadow:0 12px 34px #0004;min-width:240px;padding:6px;display:none}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;min-height:44px}
.menu button:hover{background:var(--soft)}
.menu .who{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who small{color:var(--mute);display:block}
.menu .mnote{margin:4px 12px 8px;font-size:13px;color:var(--mute)}
.gpill{font-weight:700}
.gpill svg{flex:none}
[hidden]{display:none!important}

/* legend */
.legend{position:fixed;left:12px;bottom:24px;z-index:900;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:0 6px 18px #0002;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px;max-width:320px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid #0002}
.legend p{margin:0;width:100%;color:var(--mute);font-size:12px}

/* panel */
.panel{position:fixed;top:70px;right:12px;bottom:12px;width:min(430px,calc(100vw - 24px));z-index:1000;background:var(--card);border-radius:20px;box-shadow:0 16px 44px #0005;display:flex;flex-direction:column;overflow:hidden;transform:translateX(110%);transition:transform .25s ease}
.panel.open{transform:none}
.ph{position:relative;padding:22px 22px 16px;background:var(--wine-d);color:#fff}
.ph h2{font-size:34px}
.ph .sub{color:#f0d9e1;font-size:14px;margin-top:6px}
.ph .x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#ffffff22;color:#fff;font-size:22px;line-height:1}
.ph .x:hover{background:#ffffff40}
.ph .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ph .meta span{background:#ffffff1f;border-radius:999px;padding:3px 10px;font-size:13px}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 10px}
.tabs button{border:0;background:none;padding:12px 12px;min-height:46px;font-weight:500;color:var(--mute);border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--wine)}
.pb{flex:1;overflow:auto;padding:18px 22px 26px}
.pb p{margin:0 0 12px}
.wine{display:grid;grid-template-columns:14px 1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.wine:last-child{border-bottom:0}
.wine i{width:12px;height:12px;border-radius:50%;margin-top:6px;border:1px solid #0002}
.wine b{font-weight:700}
.wine .pr{font-weight:700;white-space:nowrap;text-align:right}
.wine .n{grid-column:2/4;color:var(--mute);font-size:15px}
.wine .t{font-size:13px;color:var(--mute);display:block}
.src{grid-column:2/4;margin-top:6px;font-size:14px;border-left:2px solid var(--line);padding-left:10px}
.srow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:2px 0}
.srow .sp{font-weight:700;min-width:62px;white-space:nowrap}
.srow a{color:var(--wine);text-decoration:none}
.srow a:hover{text-decoration:underline}
.snote{color:var(--mute);font-size:12.5px}
.ev{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ev h3{font:700 17px "DM Sans",sans-serif}
.ev .when{color:var(--wine);font-weight:500;font-size:14px;margin:4px 0 6px}
.ev .who{font-size:13px;color:var(--mute)}
.ev p{font-size:15px;margin:6px 0 10px}
.live{display:inline-block;background:#c62e4a;color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--wine)}
.btn.pri{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.on{background:var(--soft);border-color:var(--wine)}
.btn[disabled]{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:30px 10px}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h h3{font-size:24px}
.cal-h button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:16px}
.cal .dow{font-size:12px;color:var(--mute);text-align:center;padding:4px 0}
.cal button{height:42px;border:0;border-radius:10px;background:none;font-size:14px;position:relative;min-height:36px}
.cal button:hover{background:var(--soft)}
.cal button.has::after{content:"";position:absolute;left:50%;bottom:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--wine)}
.cal button.today{font-weight:700;outline:1px solid var(--gold)}
.cal button.sel{background:var(--wine);color:#fff}
.cal button.sel::after{background:#fff}
.cal button.out{opacity:.35}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:14px;min-height:32px}
.chk input{width:18px;height:18px;accent-color:var(--wine)}

/* forms */
form label{display:block;font-size:14px;font-weight:500;margin:12px 0 4px}
form input,form select,form textarea{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg)}
form textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.box{border:1px solid var(--line);border-radius:14px;padding:4px 12px 12px;margin-top:10px;position:relative}
.box .rm{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--mute);min-height:32px;font-size:13px}
form h3{font-size:22px;margin-top:22px}
.status{border-radius:14px;padding:14px;background:var(--soft);margin-bottom:12px}
.req{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.req .person{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.req img{width:34px;height:34px;border-radius:50%}
.req small{color:var(--mute);display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:3000;transition:transform .25s;max-width:90vw}
.toast.show{transform:translateX(-50%)}

/* gate */
.gate{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:color-mix(in srgb,var(--wine-d) 55%,transparent);backdrop-filter:blur(3px);padding:16px}
.gate[hidden]{display:none}
.gcard{background:var(--card);border-radius:24px;max-width:440px;width:100%;padding:34px 30px 26px;box-shadow:0 30px 70px #0006;text-align:center}
.gcard h1{font-size:46px;margin:12px 0 8px}
.gcard h1 span{color:var(--wine)}
.gcard p{color:var(--mute);margin:0 0 22px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:52px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-weight:700;font-size:16px}
.gbtn img{width:28px;height:28px;border-radius:50%}
.gbtn:hover{border-color:var(--wine)}
.guest{margin-top:12px;border:0;background:none;color:var(--mute);text-decoration:underline;min-height:40px}
.proto{font-size:12px;color:var(--mute);margin-top:16px;line-height:1.4}

.fsheet{position:fixed;top:66px;right:12px;z-index:1001;width:min(400px,calc(100vw - 24px));max-height:calc(100vh - 84px);background:var(--card);border-radius:18px;box-shadow:0 16px 44px #0005;display:flex;flex-direction:column;overflow:hidden}
.fh{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 18px;border-bottom:1px solid var(--line)}
.fh h2{font-size:28px;flex:1}
.fh .x{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:22px;line-height:1}
.fb{overflow:auto;padding:4px 18px 14px}
.fb h3{font:700 12.5px "DM Sans",sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:6px 13px;min-height:40px;display:inline-flex;align-items:center;gap:7px;font-size:14px}
.chip:hover{border-color:var(--wine)}
.chip[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:#fff}
.chip i{width:11px;height:11px;border-radius:50%;border:1px solid #0003}
.showall{display:flex;align-items:center;gap:10px;padding:8px 0 4px;font-size:14.5px;cursor:pointer}
.showall input,.area input{width:18px;height:18px;margin:0;accent-color:var(--wine);flex:none}
.areas details{border-top:1px solid var(--line)}
.areas summary{padding:11px 2px;cursor:pointer;font-weight:700;font-size:15px;list-style-position:inside}
.areas summary span{float:right;font-weight:400;color:var(--mute);font-size:13px}
.area{display:grid;grid-template-columns:18px 14px 1fr;gap:1px 10px;align-items:center;padding:6px 2px;cursor:pointer;border-radius:8px}
.area:hover{background:var(--soft)}
.area .sw{width:14px;height:14px;border-radius:4px;border:1.5px solid}
.area small{grid-column:3;color:var(--mute);font-size:12.5px;line-height:1.35}
.chip .n{font-size:11.5px;opacity:.7}
.areg{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:8px 2px 2px}
.area em{font-style:normal;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:4px}
.fnote{font-size:12px;color:var(--mute);margin:10px 0 0}
.ff{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.ff .cnt{flex:1;font-size:14px;color:var(--mute)}
.ff .cnt b{color:var(--ink)}
.alist{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0;min-height:48px}
.alist:hover{color:var(--wine)}
.alist small{display:block;color:var(--mute);font-size:13px}
path.leaflet-interactive:focus{outline:none}
.zlabel{background:none!important;border:0!important;box-shadow:none!important;font:700 12px "DM Sans",sans-serif;color:#2a0d18;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.zlabel:before{display:none}

@media(max-width:700px){
 .fsheet{top:auto;bottom:0;left:0;right:0;width:100%;max-height:82vh;border-radius:20px 20px 0 0}
 .brand b{display:none}.brand{padding:6px 10px}
 .pill .lbl{display:none}.pill{padding:0 13px}
 .panel{top:auto;left:0;right:0;bottom:0;width:100%;height:76vh;border-radius:20px 20px 0 0;transform:translateY(105%)}
 .legend{display:none}
 .search{max-width:none}.sp{display:none}
}
/* phones: keep controls clear of the notch and home bar (installed app / phone app) */
.bar{top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right))}
.panel{top:calc(70px + env(safe-area-inset-top));bottom:calc(12px + env(safe-area-inset-bottom))}
.fsheet{top:calc(66px + env(safe-area-inset-top))}
.toast{bottom:calc(24px + env(safe-area-inset-bottom))}
.leaflet-bottom{margin-bottom:env(safe-area-inset-bottom)}
@media(max-width:700px){
 .panel{top:auto;bottom:0;padding-bottom:env(safe-area-inset-bottom)}
 .fsheet{top:auto;padding-bottom:env(safe-area-inset-bottom)}
}
/* wine chat */
.fab{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));z-index:950;height:56px;padding:0 20px 0 6px;border-radius:999px;border:0;background:#B3141F;color:#F7F1E6;display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;box-shadow:0 10px 26px #0005}
.fab:hover{filter:brightness(1.08)}
.ava{flex:none;border-radius:50%;background:#F7F1E6;border:2px solid #E0BC62;object-fit:cover}
.fab .ava{width:44px;height:44px}.chh .ava{width:48px;height:48px}
.hello{display:flex;gap:12px;align-items:flex-end}.hello img{flex:none;width:72px;height:110px}
.leaflet-bottom.leaflet-right .leaflet-control-zoom{margin-bottom:76px}
.chat{position:fixed;right:12px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:1002;width:min(390px,calc(100vw - 24px));height:min(600px,calc(100vh - 110px));background:var(--card);border-radius:20px;box-shadow:0 16px 44px #0005;display:flex;flex-direction:column;overflow:hidden}
.chh{display:flex;align-items:center;gap:8px;padding:14px 12px 12px 18px;background:#B3141F;color:#F7F1E6}
.chh div{flex:1}.chh h2{font:600 24px Fraunces,Georgia,serif}.chh small{opacity:.85;font-size:13px}
.chh .x{width:40px;height:40px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:22px;line-height:1}
.clog{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;border-radius:16px;padding:10px 13px;font-size:15px;line-height:1.45}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}.msg ul{margin:4px 0 8px;padding-left:20px}
.msg.bot{background:var(--soft);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--wine);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg .acts{margin-top:8px}.msg .note{margin-top:6px}
.csug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.csug .chip{min-height:36px;font-size:13.5px;background:var(--card)}
.clist{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.cres{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 11px;min-height:44px}
.cres:hover{border-color:var(--wine)}
.cres i{flex:none;width:11px;height:11px;border-radius:50%;margin-top:6px;border:1px solid #0003}
.cres small,.cev small{display:block;color:var(--mute);font-size:13px}.cres .cw{color:var(--ink)}
.cev{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 11px}.cev .acts{margin-top:6px}.cev .btn{min-height:36px}
.cin{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.cin input{flex:1;height:46px;border-radius:999px;border:1px solid var(--border);background:var(--bg);padding:0 16px;font-size:16px}
.cin .btn{width:46px;height:46px;padding:0}
.fids{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}.fids span{flex:1}
@media(max-width:700px){
 .chat{left:0;right:0;bottom:0;width:100%;height:82vh;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}
 .fab span{display:none}.fab{width:56px;padding:0;justify-content:center}
}
@media(min-width:701px){.panel.open~.chat{right:calc(min(430px,100vw - 24px) + 24px)}}
/* inside the Android / iPhone app Google sign-in is not available yet */
.inapp #gBtn{display:none!important}
@media(prefers-reduced-motion:reduce){.panel,.toast,.bottle{transition:none}}
</style>
<script>
// installed app / service worker
if("serviceWorker" in navigator && location.protocol==="https:") addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
if(/WinearApp/.test(navigator.userAgent)) document.documentElement.classList.add("inapp");
</script>
</head>
<body>
<div id="map" aria-label="World map of wineries"></div>

<header class="bar">

  <button class="pill me" id="meBtn" hidden aria-label="Account menu" aria-haspopup="true"><img id="meImg" alt=""><span id="adminBadge" class="badge" hidden></span></button>

    <svg width="40" height="66" viewBox="0 0 26 44" aria-hidden="true"><path d="M10 1h6v10c0 3 6 6 6 13v17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V24c0-7 6-10 6-13z" fill="#6d1a36"/><rect x="6" y="26" width="14" height="9" rx="1" fill="#d7ae4e"/></svg>
    <h1>Winear<span>.me</span></h1>
    <p>Find wineries near you, read their stories, browse their wines and never miss a tasting.</p>
    <button class="gbtn" id="signin" disabled><img id="gImg" alt="" hidden><span id="gTxt">Checking your account…</span></button>
    <button class="guest" id="guestBtn">Just browse the map</button>
    <div class="proto">Prototype: sign-in uses your Claude account. The live site will use “Sign in with Google”.</div>
  </div>
</div>

<script src="leaflet.js"></script>
<script src="topojson-client.min.js"></script>
<script src="firebase-config.js?v=20261124b"></script>
<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STYLES={red:["Red","#7b1e3a"],white:["White","#e6d27e"],rose:["Rosé","#ee9aac"],sparkling:["Sparkling","#f3e7b5"],sweet:["Sweet","#c98a2c"],amber:["Amber","#d0773a"],champagne:["Champagne","#24553a"]};
const TYPECOL={Red:"#7b1e3a",White:"#e6d27e","Rosé":"#ee9aac",Sparkling:"#f3e7b5",Sweet:"#c98a2c",Amber:"#d0773a",Champagne:"#24553a",Fortified:"#5a1a12"};
const NOW=new Date();
const S={catalog:[],mine:{},approved:new Set(),requests:{},myReq:null,plans:[],db:null,user:null,id:null,owner:false,guest:false,open:null,tab:"story",view:null,calMonth:new Date(NOW.getFullYear(),NOW.getMonth(),1),calDay:null,inView:false,f:{areas:new Set(),showAll:false,cols:new Set(),prices:new Set(),countries:new Set()}};

/* ---------- map ---------- */
const map=L.map("map",{zoomControl:false,worldCopyJump:true,minZoom:2,maxZoom:17,zoomSnap:.5,attributionControl:true}).setView([22,10],2.5);
L.control.zoom({position:"bottomright"}).addTo(map);
map.attributionControl.setPrefix(false);
L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{subdomains:"abc",maxZoom:17,detectRetina:false,crossOrigin:true,
  attribution:'Map data: &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, SRTM | Map style: &copy; <a href="https://opentopomap.org" target="_blank" rel="noopener">OpenTopoMap</a> (CC-BY-SA)'}).addTo(map);
function bottleSvg(c,cap="#2a0d18"){return `<svg class="bottle" width="26" height="44" viewBox="0 0 26 44"><ellipse cx="13" cy="42.5" rx="9" ry="1.6" fill="#0003"/><path d="M10 1h6v10c0 3 6 6 6 13v17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V24c0-7 6-10 6-13z" fill="${c}" stroke="#2a0d18" stroke-width="1.2"/><rect x="9.6" y=".6" width="6.8" height="${cap==="#2a0d18"?4:9}" rx="1" fill="${cap}"/><rect x="6" y="25" width="14" height="10" rx="1.2" fill="#fbf6ee" stroke="#2a0d18" stroke-width=".6"/><path d="M8 17c1.5-2 2.5-3 2.5-6" stroke="#fff8" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`}
const icons={};
for(const k in STYLES)icons[k]=L.divIcon({className:"",html:bottleSvg(STYLES[k][1],k==="champagne"?"#d7ae4e":undefined),iconSize:[26,44],iconAnchor:[13,43],tooltipAnchor:[0,-42]});
const markers=L.layerGroup().addTo(map);

function all(){
  const mine=Object.entries(S.mine).filter(([id,w])=>S.approved.has(id)&&w.published!==false&&isFinite(+w.lat)&&isFinite(+w.lng)).map(([id,w])=>({...w,id,user:true}));
  return S.catalog.concat(mine);
}
function drawMarkers(){
  markers.clearLayers();
  const list=all().filter(matches),z=map.getZoom(),cell=z<6?56:0,groups=[];
  for(const w of list){
    const p=map.latLngToLayerPoint([+w.lat,+w.lng]);
    let g=cell?groups.find(g=>Math.abs(g.p.x-p.x)<cell&&Math.abs(g.p.y-p.y)<cell):null;
    if(g)g.items.push(w);else groups.push({p,items:[w]});
  }
  for(const g of groups){
    if(g.items.length===1){
      const w=g.items[0];
      L.marker([+w.lat,+w.lng],{icon:icons[w.style]||icons.red,keyboard:true,title:w.name}).bindTooltip(esc(w.name),{direction:"top"}).on("click",()=>openWinery(w.id)).addTo(markers);
    }else{
      const n=g.items.length,sz=34+Math.min(20,n*3);
      const b=L.latLngBounds(g.items.map(w=>[+w.lat,+w.lng]));
      L.marker(b.getCenter(),{icon:L.divIcon({className:"",html:`<div class="cluster" style="width:${sz}px;height:${sz}px">${n}</div>`,iconSize:[sz,sz]}),title:n+" wineries"})
        .bindTooltip(esc([...new Set(g.items.map(w=>w.region.split(/[–,]/)[0].trim()))].slice(0,3).join(", ")),{direction:"top"})
        .on("click",()=>map.flyToBounds(b.pad(.6),{maxZoom:Math.max(z+2.5,7),duration:.8})).addTo(markers);
    }
  }
}
map.on("zoomend",drawMarkers);
const find=id=>all().find(w=>w.id===id);

/* ---------- wine areas (PDO) & filters ---------- */
let ZONES=[];
const zoneLayer=L.layerGroup().addTo(map);
const REGIONS=["Macedonia","Thessaly","Epirus","Peloponnese","Ionian Islands","Aegean Islands","Crete"];
const zlabel=z=>(z.kind?z.kind+" ":"")+z.name;
const ccmp=(a,b)=>(a==="Greece"?-1:b==="Greece"?1:a.localeCompare(b));
const COLS=[["red","Red"],["white","White"],["rose","Rosé"],["sparkling","Sparkling"],["sweet","Sweet"],["amber","Amber"],["champagne","Champagne"]];
const TYPE2COL={Red:"red",White:"white","Rosé":"rose",Sparkling:"sparkling",Sweet:"sweet",Fortified:"sweet",Amber:"amber",Champagne:"champagne"};
const colOk=c=>S.f.cols.has(c)||(c==="champagne"&&S.f.cols.has("sparkling"));
const PRICES=[["u10","Under €10",0,10],["10-20","€10–20",10,20],["20-40","€20–40",20,40],["40p","€40 and up",40,1e9]];
const zcol=i=>`hsl(${Math.round(i*137.508)%360} 70% 42%)`;
function inRing(x,y,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const[xi,yi]=r[i],[xj,yj]=r[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function inZone(z,lat,lng){const b=z.bb;if(lng<b[0]||lng>b[2]||lat<b[1]||lat>b[3])return false;
  const polys=z.geometry.type==="Polygon"?[z.geometry.coordinates]:z.geometry.coordinates;
  return polys.some(p=>inRing(lng,lat,p[0])&&!p.slice(1).some(h=>inRing(lng,lat,h)))}
const zcache=new Map();
function zonesOf(w){const k=w.id+"@"+w.lat+","+w.lng;if(!zcache.has(k))zcache.set(k,ZONES.filter(z=>inZone(z,+w.lat,+w.lng)));return zcache.get(k)}
function wineOk(x){const f=S.f;
  if(f.cols.size&&!colOk(TYPE2COL[x.type]))return false;
  if(f.prices.size){const p=x.price;if(p===""||p==null||!isFinite(+p))return false;if(!PRICES.some(([k,,lo,hi])=>f.prices.has(k)&&+p>=lo&&+p<hi))return false}
  return true}
function matches(w){const f=S.f;
  if(f.ids&&!f.ids.has(w.id))return false;
  if(f.countries.size&&!f.countries.has(w.country))return false;
  if(f.areas.size&&!zonesOf(w).some(z=>f.areas.has(z.id)))return false;
  if(f.cols.size||f.prices.size){const ws=w.wines||[];
    if(!ws.length)return !f.prices.size&&(!f.cols.size||colOk(w.style));
    if(!ws.some(wineOk))return false}
  return true}
const nActive=()=>S.f.areas.size+S.f.cols.size+S.f.prices.size+S.f.countries.size+(S.f.ids?1:0);
function drawZones(){
  zoneLayer.clearLayers();
  const show=ZONES.filter(z=>S.f.areas.has(z.id)||(S.f.showAll&&(!S.f.countries.size||S.f.countries.has(z.country))));
  for(const z of show){
    const sel=S.f.areas.has(z.id);
    L.geoJSON(z.geometry,{style:{color:z.col,weight:sel?2.5:1.5,fillColor:z.col,fillOpacity:sel?.32:.2,opacity:.9}})
      .bindTooltip(`<b>${esc(zlabel(z))}</b> · ${esc(z.country)}<br>${esc(z.wines)}`,{sticky:true})
      .on("click",()=>openArea(z.id)).addTo(zoneLayer);
  }
  $("#legendZones").hidden=!show.length;
}
function fitAreas(){const sel=ZONES.filter(z=>S.f.areas.has(z.id));if(!sel.length)return;
  const b=L.latLngBounds([]);sel.forEach(z=>b.extend([[z.bb[1],z.bb[0]],[z.bb[3],z.bb[2]]]));
  map.flyToBounds(b.pad(.15),{maxZoom:11,duration:.8,paddingTopLeft:[0,60],paddingBottomRight:window.innerWidth>700&&!$("#fsheet").hidden?[420,0]:[0,0]})}
function fitCountries(){const cs=S.f.countries;if(!cs.size)return;
  const b=L.latLngBounds([]);all().filter(w=>cs.has(w.country)).forEach(w=>b.extend([+w.lat,+w.lng]));
  ZONES.filter(z=>cs.has(z.country)).forEach(z=>b.extend([[z.bb[1],z.bb[0]],[z.bb[3],z.bb[2]]]));
  if(b.isValid())map.flyToBounds(b.pad(.1),{maxZoom:9,duration:.8,paddingTopLeft:[0,60],paddingBottomRight:window.innerWidth>700&&!$("#fsheet").hidden?[420,0]:[0,0]})}
function applyFilters(fit){
  drawZones();drawMarkers();
  const n=nActive(),b=$("#fBadge");b.hidden=!n;b.textContent=n;
  if(fit)fitAreas();
  if(!$("#fsheet").hidden)renderFilters();
  if(S.view==="area")renderArea();
}
function renderFilters(){
  const f=S.f,list=all(),hit=list.filter(matches).length;
  const byC=[...new Set(ZONES.map(z=>z.country))].sort(ccmp).map(c=>[c,ZONES.filter(z=>z.country===c)]);
  const nBy={};for(const w of list)nBy[w.country]=(nBy[w.country]||0)+1;
  const ctry=[...new Set(Object.keys(nBy).concat(ZONES.map(z=>z.country)))].sort(ccmp);
  const regOrd=c=>c==="Greece"?(a,b)=>REGIONS.indexOf(a.region)-REGIONS.indexOf(b.region):(a,b)=>a.region.localeCompare(b.region);
  const sheet=$("#fsheet");const scroll=sheet.querySelector(".fb")?.scrollTop||0;
  const openReg=new Set([...sheet.querySelectorAll("details[open]")].map(d=>d.dataset.reg));
  sheet.innerHTML=`<div class="fh"><h2>Filter the map</h2><button class="x" aria-label="Close filters">×</button></div>
  <div class="fb">
   ${f.ids?`<div class="fids"><span>From the chat: <b>${esc(f.idsLabel||"selected wineries")}</b></span><button class="btn" id="fIds">Remove</button></div>`:""}
   <h3>Wine colour</h3><div class="chips">${COLS.map(([k,l])=>`<button class="chip" data-col="${k}" aria-pressed="${f.cols.has(k)}"><i style="background:${STYLES[k][1]}"></i>${l}</button>`).join("")}</div>
   <h3>Country</h3><div class="chips">${ctry.map(c=>`<button class="chip" data-country="${esc(c)}" aria-pressed="${f.countries.has(c)}">${esc(c)}${nBy[c]?`<small class="n">${nBy[c]}</small>`:""}</button>`).join("")}</div>
   <h3>Price per bottle</h3><div class="chips">${PRICES.map(([k,l])=>`<button class="chip" data-price="${k}" aria-pressed="${f.prices.has(k)}">${l}</button>`).join("")}</div>
   <h3>Wine areas · ${ZONES.length} areas in ${byC.length} countries</h3>
   <label class="showall"><input type="checkbox" id="fAll" ${f.showAll?"checked":""}>Show all areas on the map</label>
   <div class="areas">${byC.map(([c,zs])=>{const on=zs.filter(z=>f.areas.has(z.id)).length;let last="";
     return `<details data-reg="${esc(c)}" ${on||openReg.has(c)?"open":""}><summary>${esc(c)}<span>${on?on+" selected · ":""}${zs.length}</span></summary>
     ${[...zs].sort(regOrd(c)).map(z=>{const h=z.region!==last?`<div class="areg">${esc(z.region)}</div>`:"";last=z.region;
       return h+`<label class="area"><input type="checkbox" data-area="${z.id}" ${f.areas.has(z.id)?"checked":""}><span class="sw" style="background:color-mix(in srgb,${z.col} 35%,transparent);border-color:${z.col}"></span><span>${esc(z.name)}${z.kind?` <em>${esc(z.kind)}</em>`:""}</span><small>${esc(z.wines)}</small></label>`}).join("")}</details>`}).join("")}</div>
   <p class="fnote">Tap an area on the map for its wines and wineries. Labels show each country's appellation tier (AOC, DOCG, DO, PDO…). Outlines are approximate.</p>
  </div>
  <div class="ff"><span class="cnt"><b>${hit}</b> of ${list.length} wineries</span><button class="btn" id="fClear" ${nActive()||f.showAll?"":"disabled"}>Clear all</button><button class="btn pri" id="fDone">Show map</button></div>`;
  sheet.querySelector(".fb").scrollTop=scroll;
}
function openFilters(){const sh=$("#fsheet");sh.hidden=false;$("#fBtn").setAttribute("aria-expanded","true");hideMenu?.();renderFilters();sh.querySelector("button")?.focus()}
function closeFilters(){$("#fsheet").hidden=true;$("#fBtn").setAttribute("aria-expanded","false")}
$("#fBtn").addEventListener("click",()=>$("#fsheet").hidden?openFilters():closeFilters());
$("#fsheet").addEventListener("click",e=>{
  const t=e.target;
  if(t.closest(".x")||t.closest("#fDone")){closeFilters();return}
  if(t.closest("#fClear")){S.f.areas.clear();S.f.cols.clear();S.f.prices.clear();S.f.countries.clear();S.f.showAll=false;S.f.ids=null;applyFilters();return}
  if(t.closest("#fIds")){S.f.ids=null;applyFilters();return}
  const c=t.closest("[data-col]");if(c){const k=c.dataset.col;S.f.cols.has(k)?S.f.cols.delete(k):S.f.cols.add(k);applyFilters();return}
  const k2=t.closest("[data-country]");if(k2){const k=k2.dataset.country,cs=S.f.countries;cs.has(k)?cs.delete(k):cs.add(k);applyFilters();fitCountries();return}
  const p=t.closest("[data-price]");if(p){const k=p.dataset.price;S.f.prices.has(k)?S.f.prices.delete(k):S.f.prices.add(k);applyFilters();return}
});
$("#fsheet").addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fAll"){S.f.showAll=t.checked;applyFilters();return}
  if(t.dataset.area){const k=t.dataset.area;t.checked?S.f.areas.add(k):S.f.areas.delete(k);applyFilters(t.checked)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#fsheet").hidden){e.stopImmediatePropagation();closeFilters();$("#fBtn").focus()}},true);
function openArea(id){S.area=id;renderArea()}
function renderArea(){
  const z=ZONES.find(z=>z.id===S.area);if(!z)return closePanel();
  const inside=all().filter(w=>zonesOf(w).includes(z)).sort((a,b)=>a.name.localeCompare(b.name));
  const sel=S.f.areas.has(z.id);
  const meta=`<div class="meta">${z.styles.map(s=>`<span>${esc(STYLES[s]?.[0]||s)}</span>`).join("")}<span>${esc(z.region)}, ${esc(z.country)}</span></div>`;
  show(head(esc(zlabel(z)),z.el&&z.el!==z.name?esc(z.el):"",meta)+`<div class="pb"><p>${esc(z.wines)}.</p>
   <div class="acts" style="margin-bottom:14px"><button class="btn ${sel?"on":""}" data-areafilter="${z.id}">${sel?"✓ Showing only this area":"Show only wineries in this area"}</button></div>
   <h3 style="font-size:22px;margin:6px 0 4px">Wineries here (${inside.length})</h3>
   ${inside.map(w=>`<button class="alist" data-open="${esc(w.id)}">${esc(w.name)}<small>${esc(w.region)}</small></button>`).join("")||'<p class="empty">No wineries on the map in this area yet.</p>'}
   <p class="note">${z.approx?"The shaded outline is approximate, drawn around the main wine villages of the area.":"The appellation covers the whole island."}</p></div>`,"area");
}
$("#panel").addEventListener("click",e=>{const b=e.target.closest("[data-areafilter]");if(!b)return;const k=b.dataset.areafilter;
  if(S.f.areas.has(k))S.f.areas.delete(k);else S.f.areas.add(k);applyFilters(S.f.areas.has(k))});
Promise.all(["pdo.json?v=20261125a","areas-europe.json?v=20261125a"].map(u=>fetch(u,{cache:"no-cache"}).then(r=>r.json()).catch(()=>[]))).then(([gr,eu])=>{
  const d=gr.map(z=>({kind:"PDO",country:"Greece",...z})).concat(eu);
  ZONES=d.map((z,i)=>{let x0=180,y0=90,x1=-180,y1=-90;const polys=z.geometry.type==="Polygon"?[z.geometry.coordinates]:z.geometry.coordinates;
    for(const p of polys)for(const[x,y]of p[0]){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
    return{...z,bb:[x0,y0,x1,y1],col:zcol(i)}});
  zcache.clear();applyFilters();
}).catch(()=>{});

/* ---------- legend ---------- */
$("#legend").innerHTML=Object.values(STYLES).map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join("")+`<p>Bottle colour = the wine each estate is best known for. Wineries outside Greece are fictional samples.</p><p id="legendZones" hidden>Shaded areas: wine appellations (approximate). Tap one for details.</p>`;

/* ---------- helpers ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2600)}
const dfmt=new Intl.DateTimeFormat(undefined,{weekday:"short",day:"numeric",month:"short"});
const tfmt=new Intl.DateTimeFormat(undefined,{hour:"2-digit",minute:"2-digit"});
function when(e){const a=new Date(e.start),b=new Date(e.end||e.start);const same=a.toDateString()===b.toDateString();return same?`${dfmt.format(a)} · ${tfmt.format(a)}–${tfmt.format(b)}`:`${dfmt.format(a)} ${tfmt.format(a)} → ${dfmt.format(b)} ${tfmt.format(b)}`}
const isLive=e=>new Date(e.start)<=NOW&&NOW<=new Date(e.end||e.start);
function money(p,c){if(p===0||p==="0")return"Free";if(p===""||p==null)return"";try{return new Intl.NumberFormat(undefined,{style:"currency",currency:c||"EUR",minimumFractionDigits:(+p%1?2:0),maximumFractionDigits:2}).format(+p)}catch{return esc(p+" "+(c||""))}}
const gdate=s=>{const d=new Date(s);const p=n=>String(n).padStart(2,"0");return`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`};
function gcal(w,e){const u=new URL("https://calendar.google.com/calendar/render");u.searchParams.set("action","TEMPLATE");u.searchParams.set("text",`${e.title} – ${w.name}`);u.searchParams.set("dates",gdate(e.start)+"/"+gdate(e.end||e.start));u.searchParams.set("details",(e.desc||"")+"\n\nFound on Winear.me");u.searchParams.set("location",`${w.name}, ${w.region}, ${w.country}`);return u.toString()}
function allEvents(){const out=[];for(const w of all())for(const e of(w.events||[]))if(e&&e.start)out.push({w,e});return out.sort((a,b)=>new Date(a.e.start)-new Date(b.e.start))}
const planKey=(w,e)=>w.id+"|"+e.id;
const saved=(w,e)=>S.plans.includes(planKey(w,e));

/* ---------- panel ---------- */
const panel=$("#panel");
function show(html,view){panel.innerHTML=html;panel.classList.add("open");S.view=view;panel.querySelector(".x")?.addEventListener("click",closePanel)}
function closePanel(){panel.classList.remove("open");S.view=null;S.open=null;stopPick()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#menu").style.display==="block")hideMenu();else closePanel()}});
const head=(t,sub,meta="")=>`<div class="ph"><button class="x" aria-label="Close">×</button><h2>${t}</h2>${sub?`<div class="sub">${sub}</div>`:""}${meta}</div>`;

function evCard(w,e,showWinery){
  const sv=saved(w,e);
  return `<div class="ev"><h3>${esc(e.title)}${isLive(e)?'<span class="live">Happening now</span>':""}</h3>
  <div class="when">${esc(when(e))}${e.price!==""&&e.price!=null?" · "+esc(money(e.price,(w.wines?.[0]?.cur)||"EUR")):""}</div>
  ${showWinery?`<div class="who">${esc(w.name)} · ${esc(w.region)}, ${esc(w.country)}</div>`:""}
  ${e.desc?`<p>${esc(e.desc)}</p>`:""}
  <div class="acts">
   <a class="btn" href="${esc(gcal(w,e))}" target="_blank" rel="noopener">＋ Google Calendar</a>
   <button class="btn ${sv?"on":""}" data-save="${esc(planKey(w,e))}" ${S.id?"":"disabled title='Sign in to save'"}>${sv?"★ Saved":"☆ Save to my plans"}</button>
   ${showWinery?`<button class="btn" data-open="${esc(w.id)}">View winery</button>`:""}
  </div></div>`;
}
panel.addEventListener("click",async ev=>{
  const s=ev.target.closest("[data-save]");if(s){togglePlan(s.dataset.save);return}
  const o=ev.target.closest("[data-open]");if(o){openWinery(o.dataset.open,true);return}
  const t=ev.target.closest("[data-tab]");if(t){S.tab=t.dataset.tab;renderWinery();return}
});

function openWinery(id,fly){
  const w=find(id);if(!w)return;
  S.open=id;S.tab="story";renderWinery();
  if(fly)map.flyTo([+w.lat,+w.lng],Math.max(map.getZoom(),13),{duration:.8});
}
function priceList(x){
  if(!x.prices||!x.prices.length)return"";
  return `<div class="src">${x.prices.map(q=>{const u=/^https:\/\//.test(q.url||"")?q.url:"";
    return `<div class="srow"><span class="sp">${esc(money(q.price,q.cur))}</span>${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(q.shop)} ↗</a>`:esc(q.shop)}${q.note?` <span class="snote">· ${esc(q.note)}</span>`:""}</div>`}).join("")}<div class="snote">Shop prices as listed online${x.checked?", "+esc(x.checked):""}. Prices may have changed.</div></div>`;
}
function renderWinery(){
  const w=find(S.open);if(!w)return closePanel();
  const st=STYLES[w.style]||STYLES.red;
  const meta=`<div class="meta">${w.founded?`<span>Since ${esc(w.founded)}</span>`:""}<span>${esc(st[0])} specialist</span>${w.hours?`<span>${esc(w.hours)}</span>`:""}</div>`;
  const tabs=[["story","Story"],["wines",`Wines (${(w.wines||[]).length})`],["events",`Events (${(w.events||[]).length})`]];
  let body="";
  if(S.tab==="story")body=`${String(w.story||"").split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join("")||'<p class="empty">No story yet.</p>'}${w.user?"":w.real?'<p class="note">Listing prepared from public information; the map pin shows the approximate area. Is this your winery? Soon you will be able to claim this page and add your own story, wines, prices and events.</p>':'<p class="note">Sample winery for the prototype.</p>'}`;
  if(S.tab==="wines")body=(w.wines||[]).length?(w.wines).map(x=>`<div class="wine"><i style="background:${TYPECOL[x.type]||"#999"}"></i><div><b>${esc(x.name)}</b><span class="t">${esc(x.type)}</span></div><div class="pr">${x.prices&&x.prices.length>1?"from ":""}${esc(money(x.price,x.cur))}</div><div class="n">${esc(x.notes)}</div>${priceList(x)}</div>`).join(""):'<p class="empty">No wines listed yet.</p>';
  if(S.tab==="events"){const evs=[...(w.events||[])].filter(e=>e&&e.start).sort((a,b)=>new Date(a.start)-new Date(b.start));const up=evs.filter(e=>new Date(e.end||e.start)>=NOW);body=up.length?up.map(e=>evCard(w,e,false)).join(""):'<p class="empty">No upcoming events.</p>'}
  show(head(esc(w.name),`${esc(w.region)} · ${esc(w.country)}`,meta)+`<div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("")}</div><div class="pb">${body}</div>`,"winery");
}

/* ---------- events calendar ---------- */
$("#evBtn").addEventListener("click",()=>{S.view==="events"?closePanel():renderEvents()});
function renderEvents(){
  let list=allEvents().filter(x=>new Date(x.e.end||x.e.start)>=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()));
  if(S.inView){const b=map.getBounds();list=list.filter(x=>b.contains([+x.w.lat,+x.w.lng]))}
  const m=S.calMonth,y=m.getFullYear(),mo=m.getMonth();
  const days=new Set(list.map(x=>new Date(x.e.start).toDateString()));
  const first=(new Date(y,mo,1).getDay()+6)%7,start=new Date(y,mo,1-first);
  let cells="";for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=d.toDateString();
    cells+=`<button data-day="${d.getTime()}" class="${days.has(k)?"has ":""}${k===NOW.toDateString()?"today ":""}${S.calDay===k?"sel ":""}${d.getMonth()!==mo?"out":""}" aria-label="${dfmt.format(d)}">${d.getDate()}</button>`}
  const shown=S.calDay?list.filter(x=>new Date(x.e.start).toDateString()===S.calDay||(isLive(x.e)&&S.calDay===NOW.toDateString())):list;
  const live=list.filter(x=>isLive(x.e));
  show(head("Wine events","Tastings, open cellars, festivals and dinners")+`<div class="pb">
   <div class="cal-h"><button id="pm" aria-label="Previous month">‹</button><h3>${m.toLocaleString(undefined,{month:"long",year:"numeric"})}</h3><button id="nm" aria-label="Next month">›</button></div>
   <div class="cal">${["Mo","Tu","We","Th","Fr","Sa","Su"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div>
   <label class="chk"><input type="checkbox" id="inview" ${S.inView?"checked":""}> Only wineries in the visible map area</label>
   ${!S.calDay&&live.length?`<h3 style="font-size:22px;margin:4px 0 10px">Happening now</h3>${live.map(x=>evCard(x.w,x.e,true)).join("")}<h3 style="font-size:22px;margin:18px 0 10px">Coming up</h3>`:`<h3 style="font-size:22px;margin:4px 0 10px">${S.calDay?esc(dfmt.format(new Date(S.calDay))):"Coming up"}${S.calDay?' <button class="btn" id="clr" style="margin-left:8px">Show all</button>':""}</h3>`}
   ${(S.calDay?shown:shown.filter(x=>!isLive(x.e))).map(x=>evCard(x.w,x.e,true)).join("")||'<p class="empty">No events on this day.</p>'}
  </div>`,"events");
  $("#pm").onclick=()=>{S.calMonth=new Date(y,mo-1,1);renderEvents()};
  $("#nm").onclick=()=>{S.calMonth=new Date(y,mo+1,1);renderEvents()};
  $("#inview").onchange=e=>{S.inView=e.target.checked;renderEvents()};
  $("#clr")?.addEventListener("click",()=>{S.calDay=null;renderEvents()});
  panel.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{const k=new Date(+b.dataset.day).toDateString();S.calDay=S.calDay===k?null:k;renderEvents()});
}
map.on("moveend",()=>{if(S.view==="events"&&S.inView)renderEvents()});

/* ---------- plans ---------- */
async function togglePlan(key){
  if(!S.id)return toast("Sign in to save events.");if(!S.db)return toast("Saving events is coming soon.");
  const next=S.plans.includes(key)?S.plans.filter(k=>k!==key):[...S.plans,key];
  const prev=S.plans;S.plans=next;rerender();
  try{await S.db.doc(`data/users/${S.id}/plans`).set({items:next});toast(next.length>prev.length?"Saved to My plans":"Removed from My plans")}
  catch(e){S.plans=prev;rerender();toast("Could not save. You may need Contributor access.")}
}
function renderPlans(){
  const items=allEvents().filter(x=>saved(x.w,x.e));
  show(head("My plans","Events you saved")+`<div class="pb">${items.map(x=>evCard(x.w,x.e,true)).join("")||'<p class="empty">Nothing saved yet. Open a winery or the Events calendar and tap “Save”.</p>'}</div>`,"plans");
}

/* ---------- account menu ---------- */
function hideMenu(){$("#menu").style.display="none"}
$("#meBtn").addEventListener("click",e=>{e.stopPropagation();const m=$("#menu");if(m.style.display==="block")return hideMenu();renderMenu();m.style.display="block"});
document.addEventListener("click",e=>{if(!e.target.closest("#menu"))hideMenu()});
async function renderMenu(){
  if(S.fbUser){
    const u=S.fbUser;
    $("#menu").innerHTML=`<div class="who"><b></b><small></small></div><p class="mnote">Saving events and winery pages are coming soon.</p><button role="menuitem" data-m="signout">Sign out</button>`;
    $("#menu .who b").textContent=u.displayName||"Signed in";$("#menu .who small").textContent=u.email||"";return;
  }
  const me=S.user?await S.user.me():null;
  const pend=Object.values(S.requests).filter(r=>r.status==="pending").length;
  const isW=S.id&&S.approved.has(S.id);
  const items=[];
  if(S.id){
    items.push(["plans",`My plans <span class="badge">${S.plans.length}</span>`]);
    items.push(["winery",isW?"My winery":(S.myReq?.status==="pending"?"Winery request · pending":"I’m a winery")]);
    if(S.owner)items.push(["admin",`Admin · requests ${pend?`<span class="badge">${pend}</span>`:""}`]);
  }
  $("#menu").innerHTML=`<div class="who"><b></b><small></small></div>`+items.map(([k,l])=>`<button role="menuitem" data-m="${k}">${l}</button>`).join("");
  $("#menu .who b").textContent=me?.name||(S.id?"Signed in":"Guest");
  $("#menu .who small").textContent=me?.email||(S.owner?"Administrator":S.id?"":"Not signed in");
}
$("#menu").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;hideMenu();
  ({plans:renderPlans,winery:renderWineryArea,admin:renderAdmin,signout:()=>S.fb.signOut().then(()=>toast("Signed out"))})[b.dataset.m]()});

/* ---------- winery request & editor ---------- */
function renderWineryArea(){
  if(S.approved.has(S.id))return renderEditor();
  const r=S.myReq;
  if(r&&r.status==="pending")return show(head("Request sent","Waiting for the administrator")+`<div class="pb"><div class="status"><b>${esc(r.wineryName)}</b><br><span class="note">Sent ${esc(new Date(r.at).toLocaleDateString())}. You can create your winery page as soon as it is approved.</span></div><button class="btn" id="cancelReq">Withdraw request</button></div>`,"request"),$("#cancelReq").onclick=async()=>{try{await S.db.doc("requests/"+S.id).delete();toast("Request withdrawn")}catch{toast("Could not withdraw.")}};
  show(head("Are you a winery?","Ask to list your estate on Winear.me")+`<div class="pb">
   ${r&&r.status==="rejected"?'<div class="status">Your previous request was not approved. You can send a new one with more details.</div>':""}
   <p>Tell us about your winery. Once the administrator approves you, you can build your page: story, wines, prices and events.</p>
   <form id="reqF">
    <label for="rn">Winery name</label><input id="rn" required maxlength="80">
    <div class="row"><div><label for="rr">Region</label><input id="rr" required maxlength="60"></div><div><label for="rc">Country</label><input id="rc" required maxlength="60"></div></div>
    <label for="rw">Website or social page</label><input id="rw" maxlength="200" placeholder="https://">
    <label for="rp">Phone</label><input id="rp" maxlength="40" inputmode="tel">
    <label for="rm">Message to the administrator</label><textarea id="rm" maxlength="800" placeholder="Who you are, what you make, how we can verify you"></textarea>
    <p style="margin-top:16px"><button class="btn pri" type="submit">Send request</button></p>
   </form></div>`,"request");
  $("#reqF").onsubmit=async e=>{e.preventDefault();if(!S.db||!S.id)return toast("Sign in first.");
    const d={wineryName:$("#rn").value.trim(),region:$("#rr").value.trim(),country:$("#rc").value.trim(),website:$("#rw").value.trim(),phone:$("#rp").value.trim(),message:$("#rm").value.trim(),status:"pending",at:new Date().toISOString()};
    try{await S.db.doc("requests/"+S.id).set(d);S.myReq=d;toast("Request sent");renderWineryArea()}catch{toast("Could not send. Ask the site owner for Contributor access.")}};
}
const blankWine=()=>({name:"",type:"Red",price:"",cur:"EUR",notes:""});
const blankEv=()=>({id:"e"+Date.now().toString(36),title:"",start:"",end:"",price:"",desc:""});
let draft=null,pickMarker=null;
function renderEditor(){
  const cur=S.mine[S.id];
  if(!draft)draft=cur?JSON.parse(JSON.stringify(cur)):{name:S.myReq?.wineryName||"",region:S.myReq?.region||"",country:S.myReq?.country||"",founded:"",style:"red",hours:"",story:"",lat:"",lng:"",wines:[blankWine()],events:[],published:true};
  const d=draft;
  const opt=(o,v)=>o.map(([k,l])=>`<option value="${esc(k)}" ${k===v?"selected":""}>${esc(l)}</option>`).join("");
  const types=["Red","White","Rosé","Sparkling","Champagne","Sweet","Amber","Fortified"].map(t=>[t,t]);
  show(head("My winery",cur?"Edit your page, changes go live when you save":"Create your page")+`<div class="pb"><form id="edF">
   <label for="f-name">Winery name</label><input id="f-name" data-k="name" required maxlength="80">
   <div class="row"><div><label for="f-region">Region</label><input id="f-region" data-k="region" required maxlength="60"></div><div><label for="f-country">Country</label><input id="f-country" data-k="country" required maxlength="60"></div></div>
   <div class="row"><div><label for="f-founded">Founded</label><input id="f-founded" data-k="founded" inputmode="numeric" maxlength="4"></div><div><label for="f-style">Best known for</label><select id="f-style" data-k="style">${opt(Object.entries(STYLES).map(([k,v])=>[k,v[0]]),d.style)}</select></div></div>
   <label for="f-hours">Opening hours</label><input id="f-hours" data-k="hours" maxlength="80" placeholder="e.g. Daily 10:00–18:00">
   <label for="f-story">History and story</label><textarea id="f-story" data-k="story" maxlength="4000"></textarea>
   <label>Location on the map</label>
   <div class="row"><input id="f-lat" data-k="lat" placeholder="Latitude" inputmode="decimal" aria-label="Latitude"><input id="f-lng" data-k="lng" placeholder="Longitude" inputmode="decimal" aria-label="Longitude"></div>
   <p style="margin-top:8px"><button type="button" class="btn" id="pick">📍 Pick on map</button> <span class="note" id="pickNote"></span></p>
   <h3>Wines and prices</h3>
   ${d.wines.map((x,i)=>`<div class="box"><button type="button" class="rm" data-rmw="${i}">Remove</button>
     <label for="w${i}n">Wine name</label><input id="w${i}n" data-w="${i}" data-f="name" value="${esc(x.name)}" maxlength="80">
     <div class="row"><div><label for="w${i}t">Type</label><select id="w${i}t" data-w="${i}" data-f="type">${opt(types,x.type)}</select></div><div class="row"><div><label for="w${i}p">Price</label><input id="w${i}p" data-w="${i}" data-f="price" value="${esc(x.price)}" inputmode="decimal"></div><div><label for="w${i}c">Currency</label><input id="w${i}c" data-w="${i}" data-f="cur" value="${esc(x.cur)}" maxlength="3"></div></div></div>
     <label for="w${i}o">Tasting notes</label><textarea id="w${i}o" data-w="${i}" data-f="notes" maxlength="600">${esc(x.notes)}</textarea></div>`).join("")}
   <p style="margin-top:10px"><button type="button" class="btn" id="addW">＋ Add a wine</button></p>
   <h3>Events</h3>
   ${d.events.map((x,i)=>`<div class="box"><button type="button" class="rm" data-rme="${i}">Remove</button>
     <label for="e${i}t">Event title</label><input id="e${i}t" data-e="${i}" data-f="title" value="${esc(x.title)}" maxlength="100">
     <div class="row"><div><label for="e${i}s">Starts</label><input type="datetime-local" id="e${i}s" data-e="${i}" data-f="start" value="${esc(x.start)}"></div><div><label for="e${i}e">Ends</label><input type="datetime-local" id="e${i}e" data-e="${i}" data-f="end" value="${esc(x.end)}"></div></div>
     <label for="e${i}p">Price (0 = free)</label><input id="e${i}p" data-e="${i}" data-f="price" value="${esc(x.price)}" inputmode="decimal">
     <label for="e${i}d">Description</label><textarea id="e${i}d" data-e="${i}" data-f="desc" maxlength="800">${esc(x.desc)}</textarea></div>`).join("")||'<p class="note">No events yet: open doors, tastings, harvest days…</p>'}
   <p style="margin-top:10px"><button type="button" class="btn" id="addE">＋ Add an event</button></p>
   <label class="chk" style="margin-top:18px"><input type="checkbox" id="f-pub" ${d.published!==false?"checked":""}> Show my winery on the map</label>
   <p><button class="btn pri" type="submit">Save winery</button> ${cur?'<button type="button" class="btn" id="viewMine">View on map</button>':""}</p>
  </form></div>`,"editor");
  for(const k of["name","region","country","founded","hours","story","lat","lng"])$("#f-"+k).value=d[k]??"";
  const f=$("#edF");
  f.addEventListener("input",e=>{const t=e.target;if(t.dataset.k)d[t.dataset.k]=t.value;if(t.dataset.w)d.wines[+t.dataset.w][t.dataset.f]=t.value;if(t.dataset.e)d.events[+t.dataset.e][t.dataset.f]=t.value;if(t.id==="f-pub")d.published=t.checked});
  f.addEventListener("change",e=>{const t=e.target;if(t.tagName==="SELECT"){if(t.dataset.k)d[t.dataset.k]=t.value;if(t.dataset.w)d.wines[+t.dataset.w].type=t.value}if(t.id==="f-pub")d.published=t.checked});
  f.querySelectorAll("[data-rmw]").forEach(b=>b.onclick=()=>{d.wines.splice(+b.dataset.rmw,1);renderEditor()});
  f.querySelectorAll("[data-rme]").forEach(b=>b.onclick=()=>{d.events.splice(+b.dataset.rme,1);renderEditor()});
  $("#addW").onclick=()=>{d.wines.push(blankWine());renderEditor()};
  $("#addE").onclick=()=>{d.events.push(blankEv());renderEditor()};
  $("#pick").onclick=startPick;
  $("#viewMine")?.addEventListener("click",()=>{draft=null;openWinery(S.id,true)});
  f.onsubmit=async e=>{e.preventDefault();
    const lat=+d.lat,lng=+d.lng;if(!d.lat||!d.lng||!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return toast("Set your location: tap “Pick on map”.");
    const doc={name:d.name.trim(),region:d.region.trim(),country:d.country.trim(),founded:String(d.founded||"").trim(),style:STYLES[d.style]?d.style:"red",hours:d.hours.trim(),story:d.story.trim(),lat,lng,published:d.published!==false,
      wines:d.wines.filter(w=>w.name.trim()).map(w=>({name:w.name.trim(),type:w.type,price:w.price===""?"":+w.price||0,cur:(w.cur||"EUR").toUpperCase().slice(0,3),notes:w.notes.trim()})),
      events:d.events.filter(x=>x.title.trim()&&x.start).map(x=>({id:x.id,title:x.title.trim(),start:x.start,end:x.end||x.start,price:x.price===""?"":+x.price||0,desc:x.desc.trim()})),
      updated:new Date().toISOString()};
    try{await S.db.doc("wineries/"+S.id).set(doc);S.mine[S.id]=doc;drawMarkers();toast("Winery saved");draft=null;renderEditor()}catch{toast("Could not save. Check your access with the site owner.")}};
}
function startPick(){document.body.classList.add("picking");$("#pickNote").textContent="Click your winery’s spot on the map…";if(innerWidth<=700)panel.classList.remove("open");
  map.once("click",e=>{stopPick();if(!draft)return;draft.lat=e.latlng.lat.toFixed(5);draft.lng=L.Util.wrapNum(e.latlng.lng,[-180,180]).toFixed(5);
    if(pickMarker)pickMarker.remove();pickMarker=L.marker(e.latlng,{icon:icons[draft.style]||icons.red}).addTo(map);renderEditor();toast("Location set")})}
function stopPick(){document.body.classList.remove("picking");if(S.view!=="editor"&&pickMarker){pickMarker.remove();pickMarker=null}}

/* ---------- admin ---------- */
async function renderAdmin(){
  if(!S.owner)return;
  const reqs=Object.entries(S.requests).sort((a,b)=>String(b[1].at).localeCompare(String(a[1].at)));
  const ids=[...new Set([...reqs.map(r=>r[0]),...S.approved])];
  const ps=ids.length&&S.user?await S.user.profiles(ids):{};

function wineFits(x,q){
  if(q.cols.size){const c=TYPE2COL[x.type];if(!(q.cols.has(c)||(c==="champagne"&&q.cols.has("sparkling"))||(x.type==="Fortified"&&q.cols.has("sweet"))))return false}

  if(q.grapes.length){const s=norm(x.name+" "+x.notes);if(!q.grapes.some(g=>s.includes(g)))return false}
  return true}
const distKm=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};

  if(q.places.length&&!q.places.some(p=>norm(w.region).includes(p)))return false;

  return true}
function searchWineries(q,loc){
  const wineQ=q.cols.size||q.lo!=null||q.hi!=null||q.grapes.length;
  let out=[];
  for(const w of all()){
    if(!placeOk(w,q))continue;
    let hits=[];
    if(wineQ){hits=(w.wines||[]).filter(x=>wineFits(x,q));
      if(!hits.length){if((w.wines||[]).length||q.lo!=null||q.hi!=null||q.grapes.length)continue;if(!q.cols.has(w.style))continue}}
    if(q.kw){const s=norm([w.name,w.region,w.country,w.story,...(w.wines||[]).map(x=>x.name+" "+x.notes)].join(" "));if(!q.kw.every(k=>s.includes(k)))continue}

  const chatty=/\b(why|how|what|which|who|recommend|suggest|pair|pairing|match|goes? with|food|dish|dinner with|gift|present|difference|tell me|explain|best|should i|would you|do you|can you|is it|τι|ποι[οα]|πως|γιατι|προτειν)\b/.test(q.t);
  const has1=q.cols.size||q.lo!=null||q.hi!=null||q.countries.size||q.areas.length||q.places.length||q.grapes.length||q.near||q.view||q.winery;
  if(chat.ai&&!q.events&&!q.near&&!q.view&&(q.hello||!has1||chatty)){await askAI();return maybeAskFeedback()}
  await askRules(text,q);maybeAskFeedback();
}
function maybeAskFeedback(){
  if(chat.n<3||chat.fb||lsGet("winear-fb"))return;
  chat.fb="asked";
  say(`<p>May I ask a small favour? How do you find <b>Winear.me</b> so far? Tell me what you'd change, or a winery we should add, and I'll pass it to the team.</p>${chips(["Not now"])}`);
}
async function sendFeedback(text){
  chat.fb="done";lsSet("winear-fb","sent");
  let ok=false;try{ok=(await fetch("/api/feedback",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text,kind:"chat"})})).ok}catch{}
  say(ok?`<p>Thank you, friend! Your words are on their way to the team. Ask me anything else about wine whenever you like.</p>`:`<p>My messenger stumbled and your note didn't arrive. Could you try again in a moment?</p>`);
  if(!ok)chat.fb="asked";
}
const rich=t=>t.split(/\n{2,}|\n(?=[-•] )/).map(par=>`<p>${esc(par.trim()).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>")}</p>`).join("");
async function askAI(){
  const wait=say(`<p class="note">Dionysus is thinking…</p>`,"bot",false);
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:chat.hist})});
    const d=await r.json().catch(()=>({}));wait.remove();
    if(!r.ok||!d.reply){say(`<p>${esc(d.error||"Dionysus is resting.")} Meanwhile I can still search the map for you:</p>${chips(SUGG.slice(0,3))}`,"bot",false);return}
    const ws=(d.ids||[]).map(id=>all().find(w=>w.id===id)).filter(Boolean);
    let extra="";
    if(ws.length){const id="s"+(++shownN);SHOWN.set(id,{ids:ws.map(w=>w.id),label:"Dionysus's picks"});
      extra=`<div class="clist">${ws.map(w=>`<button class="cres" data-copen="${esc(w.id)}"><i style="background:${(STYLES[w.style]||STYLES.red)[1]}"></i><span><b>${esc(w.name)}</b><small>${esc(w.region)}, ${esc(w.country)}</small></span></button>`).join("")}</div><div class="acts"><button class="btn pri" data-cmap="${id}">Show ${ws.length===1?"it":"all "+ws.length} on the map</button></div>`}
    say(rich(d.reply)+extra);
    if(d.feedback){chat.fb="done";lsSet("winear-fb","sent")}
  }catch{wait.remove();say(`<p>Dionysus is resting. Meanwhile I can still search the map for you:</p>${chips(SUGG.slice(0,3))}`,"bot",false)}
}
async function askRules(text,q){
  if(q.help||q.hello)return say(`<p>${q.hello?"Hello! ":""}Ask me things like:</p><ul><li>“sweet wines from Samos”</li><li>“Xinomavro under €25”</li><li>“wineries in Nemea”</li><li>“tastings next week in Crete”</li><li>“champagne near me”</li></ul><p class="note">Even a god keeps it simple here: I understand colours, prices, grapes, countries, wine areas, winery names and dates.</p>`);
  if(q.winery&&!q.events&&!q.cols.size&&q.lo==null&&q.hi==null&&!q.grapes.length){
    const w=q.winery;say(`<p>Here's <b>${esc(w.name)}</b> in ${esc(w.region)}, ${esc(w.country)}. ${(w.wines||[]).length} wines, ${(w.events||[]).filter(e=>new Date(e.end||e.start)>=NOW).length} upcoming events.</p><div class="acts"><button class="btn pri" data-copen="${esc(w.id)}">Open winery</button></div>`);
    if(innerWidth<=700)closeChat();openWinery(w.id,true);return}
  let loc=null;
  if(q.near){const wait=say(`<p class="note">Finding your location…</p>`);loc=await getLoc();wait.remove();
    if(!loc)q.near=false;if(!loc)say(`<p class="note">I couldn't get your location, so I'll search everywhere. Allow location access in your browser to use “near me”.</p>`)}
  const has=q.cols.size||q.lo!=null||q.hi!=null||q.countries.size||q.areas.length||q.places.length||q.grapes.length||q.near||q.view||q.winery;
  if(q.events)return answerEvents(q,loc);
  if(!has){
    if(q.keywords.length){q.kw=q.keywords;const r=searchWineries(q,null);if(r.length)return answerWineries(q,r,null,`wineries mentioning “${esc(q.keywords.join(" "))}”`)}
    return say(`<p>Sorry, I didn't catch that. I understand wine colours, prices, grapes, countries, wine areas, winery names and dates. Try one of these:</p>${chips(SUGG)}`);
  }
  const r=searchWineries(q,loc);
  if(!r.length){
    const loose={...q,lo:null,hi:null,grapes:[]};const r2=(q.lo!=null||q.hi!=null||q.grapes.length)?searchWineries(loose,loc):[];
    return say(`<p>I found no ${esc(describe(q))} on the map yet.</p>${r2.length?`<p>Without the price or grape limit there are <b>${r2.length}</b>.</p><div class="acts"><button class="btn" data-ask="${esc(describe(loose))}">Show those</button></div>`:chips(SUGG.slice(0,3))}`);
  }
  answerWineries(q,r,loc);
}
function answerWineries(q,r,loc,label){
  const id="s"+(++shownN);SHOWN.set(id,{ids:r.map(x=>x.w.id),label:label||describe(q)});
  const top=r.slice(0,6);
  const li=top.map(({w,hits,d})=>{const best=[...hits].sort((a,b)=>(+a.price||1e9)-(+b.price||1e9))[0];
    return `<button class="cres" data-copen="${esc(w.id)}"><i style="background:${(STYLES[w.style]||STYLES.red)[1]}"></i><span><b>${esc(w.name)}</b><small>${esc(w.region)}, ${esc(w.country)}${d!=null?` · ${d<10?d.toFixed(1):Math.round(d)} km`:""}</small>${best?`<small class="cw">${esc(best.name)}${best.price!==""&&best.price!=null?" · "+esc(money(best.price,best.cur)):""}${hits.length>1?` · +${hits.length-1} more`:""}</small>`:""}</span></button>`}).join("");
  const wineQ=q.cols.size||q.lo!=null||q.hi!=null||q.grapes.length,desc=label||esc(describe(q));
  say(`<p>${wineQ||label?(r.length===1?"1 winery has":`<b>${r.length}</b> wineries have`)+" "+desc:(r.length===1?"1 winery":`<b>${r.length}</b> wineries`)+" "+desc.replace(/^wines ?/,"")}${r.length>top.length?`. Here are ${loc?"the closest":"the top"} ${top.length}`:""}:</p><div class="clist">${li}</div>
   <div class="acts"><button class="btn pri" data-cmap="${id}">Show ${r.length===1?"it":"all "+r.length} on the map</button></div>`);
}
function answerEvents(q,loc){
  const from=q.from||new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()),to=q.to||new Date(8e15);
  let list=allEvents().filter(({w,e})=>{const a=new Date(e.start),b=new Date(e.end||e.start);return b>=from&&a<to&&b>=NOW&&placeOk(w,q)&&(!q.winery||w.id===q.winery.id)});
  if(loc)list.sort((a,b)=>distKm(loc[0],loc[1],+a.w.lat,+a.w.lng)-distKm(loc[0],loc[1],+b.w.lat,+b.w.lng));
  const where=describe({...q,cols:new Set(),lo:null,hi:null,grapes:[]}).replace(/^wines ?/,"");
  const what=`events${q.winery?" at "+esc(q.winery.name):""}${where?" "+esc(where):""}${q.when?(/^(today|tomorrow|this|next)/.test(q.when)?" ":" in ")+esc(q.when):""}`;
  if(!list.length)return say(`<p>No ${what} on the map right now.</p><div class="acts"><button class="btn" data-cal="1">Open the events calendar</button></div>`);
  const top=list.slice(0,5);
  say(`<p><b>${list.length}</b> ${what}${list.length>top.length?`. The ${loc?"closest":"next"} ${top.length}`:""}:</p><div class="clist">${top.map(({w,e})=>`<div class="cev"><b>${esc(e.title)}</b>${isLive(e)?'<span class="live">Now</span>':""}<small>${esc(when(e))}</small><small>${esc(w.name)} · ${esc(w.region)}</small>
    <div class="acts"><button class="btn" data-copen="${esc(w.id)}" data-ctab="events">View</button><a class="btn" href="${esc(gcal(w,e))}" target="_blank" rel="noopener">＋ Calendar</a></div></div>`).join("")}</div>
    <div class="acts"><button class="btn pri" data-cal="1">Open the events calendar</button></div>`);
}
chatEl.addEventListener("click",e=>{
  const a=e.target.closest("[data-ask]");if(a){ask(a.dataset.ask);return}
  const o=e.target.closest("[data-copen]");if(o){if(innerWidth<=700)closeChat();openWinery(o.dataset.copen,true);if(o.dataset.ctab){S.tab=o.dataset.ctab;renderWinery()}return}
  const m=e.target.closest("[data-cmap]");if(m){const s=SHOWN.get(m.dataset.cmap);if(!s)return;
    S.f={...S.f,areas:new Set(),cols:new Set(),prices:new Set(),countries:new Set()};S.f.ids=new Set(s.ids);S.f.idsLabel=s.label;applyFilters();
    const b=L.latLngBounds(all().filter(w=>S.f.ids.has(w.id)).map(w=>[+w.lat,+w.lng]));
    if(innerWidth<=700)closeChat();closePanel();
    if(b.isValid())map.flyToBounds(b.pad(.2),{maxZoom:12,duration:.8,paddingTopLeft:[0,60],paddingBottomRight:innerWidth>700&&chat.open?[400,0]:[0,0]});
    toast(`Showing ${s.ids.length} ${s.ids.length===1?"winery":"wineries"} from the chat · Filters → Clear to see all`);return}
  if(e.target.closest("[data-cal]")){if(innerWidth<=700)closeChat();S.calDay=null;renderEvents()}
});

/* ---------- data ---------- */
fetch("wineries.json?v=20261125m",{cache:"no-cache"}).then(r=>r.json()).then(d=>{S.catalog=d;drawMarkers()}).catch(()=>toast("Sample wineries could not load."));

/* ---------- sign-in ---------- */
let entered=false;try{entered=sessionStorage.getItem("winear-in")==="1"}catch{}

$("#guestBtn").onclick=()=>{S.guest=true;$("#gate").hidden=true};
$("#meImg").src="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34"><circle cx="17" cy="17" r="17" fill="#6d1a36"/><circle cx="17" cy="13" r="6" fill="#fff"/><path d="M6 29c2-6 6-8 11-8s9 2 11 8" fill="#fff"/></svg>');
const giveUp=setTimeout(()=>{if(!S.id){$("#gTxt").textContent="Sign-in unavailable here";}},10000);
(async()=>{
  const user=window.claude?await claude.use("user"):null;S.user=user;
  const me=user?await user.me():null;
  if(!me||!me.id){clearTimeout(giveUp);return}
  clearTimeout(giveUp);S.id=me.id;S.owner=me.isOwner;$("#meBtn").hidden=false;
  $("#meImg").src=me.avatarUrl;$("#gImg").src=me.avatarUrl;$("#gImg").hidden=false;
  $("#gTxt").textContent="Continue as "+(me.name||"you");$("#signin").disabled=false;
  $("#signin").onclick=()=>{$("#gate").hidden=true;try{sessionStorage.setItem("winear-in","1")}catch{}toast("Welcome"+(me.name?", "+me.name.split(" ")[0]:"")+"!")};
  const db=await claude.use("db");S.db=db;if(!db)return;
  const err=()=>{};
  db.collection("wineries").onSnapshot(s=>{S.mine={};s.docs.forEach(d=>S.mine[d.id]=d.data());drawMarkers();rerender()},err);
  db.collection("approved").onSnapshot(s=>{S.approved=new Set(s.docs.map(d=>d.id));drawMarkers();rerender()},err);
  db.doc(`data/users/${S.id}/plans`).onSnapshot(s=>{S.plans=(s.exists&&Array.isArray(s.data().items))?[...s.data().items]:[];rerender()},err);
  if(S.owner)db.collection("requests").onSnapshot(s=>{S.requests={};s.docs.forEach(d=>S.requests[d.id]=d.data());S.myReq=S.requests[S.id]||null;rerender()},err);
  else db.doc("requests/"+S.id).onSnapshot(s=>{S.myReq=s.exists?s.data():null;if(S.view==="request")renderWineryArea()},err);
})();

/* ---------- Google sign-in (Firebase) on winear.me ---------- */
const FB=window.WINEAR_FIREBASE;
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
function renderAuth(){
  const u=S.fbUser;
  $("#gBtn").hidden=!!u;$("#meBtn").hidden=!u;
  if(u){const ph=u.photoURL||"";if(/^https:\/\//.test(ph))$("#meImg").src=ph;$("#meImg").referrerPolicy="no-referrer"}
  rerender();
}
if(!window.claude&&FB&&FB.apiKey){
  (async()=>{
    try{
      await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js");
      await loadScript("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js");
      firebase.initializeApp(FB);S.fb=firebase.auth();
      S.fb.onAuthStateChanged(u=>{S.fbUser=u;S.id=u?u.uid:null;renderAuth()});
      $("#gBtn").hidden=false;
      $("#gBtn").onclick=()=>S.fb.signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .then(r=>toast("Welcome"+(r.user.displayName?", "+r.user.displayName.split(" ")[0]:"")+"!"))
        .catch(e=>{if(e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request")return;
          toast(e.code==="auth/unauthorized-domain"?"This address isn't allowed in Firebase yet.":e.code==="auth/popup-blocked"?"Allow pop-ups for this site to sign in.":"Sign-in failed, please try again.")});
    }catch{ /* sign-in unavailable: map keeps working */ }
  })();
}
}
