name: Build phone apps

# Builds the Winear.me Android and iPhone apps whenever the mobile/ folder changes,
# or on demand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-apps.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npx cap sync android
      - name: Build test APK (install directly on any Android phone)
        working-directory: mobile/android
        env: { VERSION_CODE: "${{ github.run_number }}" }
        run: ./gradlew --no-daemon assembleDebug
      - name: Build signed release for Google Play (only when signing secrets are set)
        working-directory: mobile/android
        env:
          VERSION_CODE: "${{ github.run_number }}"
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets yet - skipping Play Store build."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon bundleRelease
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Winear.me.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Winear.me-Android-APK
          path: mobile/Winear.me.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Winear.me-Android-GooglePlay-AAB
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx cap sync ios
      - name: Build iPhone app (Simulator build - App Store upload needs an Apple Developer account)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Release-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/mobile/Winear.me-iOS-Simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: Winear.me-iOS-Simulator
          path: mobile/Winear.me-iOS-Simulator.zip
